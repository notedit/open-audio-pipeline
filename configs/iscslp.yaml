# ISCSLP2026-CoT-TTS 清洗配置 (影视对话, BGM/噪声重)
# 噪声源三件套开启: vad -> (条件)separate -> denoise; 输出仅限本地(license 禁止再分发).

batch_size: 64

bandwidth:               # 有效带宽: 频谱 roll-off@0.99 中位数
  enabled: true
  min_rolloff_hz: 4000.0

vad:                     # silero 语音占比检测
  enabled: true
  min_speech_ratio: 0.4

separate:                # demucs 人声分离 (含干净跳过判据)
  enabled: true

denoise:                 # ZipEnhancer 降噪
  enabled: true

duration:
  min_sec: 1.0   # 影视短句(感叹/应答)韵律价值高, 降门槛保留
  max_sec: 30.0

audiobox:
  enabled: true
  batch_size: 32   # WS 片段长(至 25s), 激活随时长放大, 批量减半防尖峰
  min_pq: 6.0
  min_ce: null
  min_cu: null
  max_pc: null

diarization:
  enabled: true
  # 多模型并集: 任一模型判多人即过滤 (v2 能抓到 Nemotron-3 漏掉的短附和; Nemotron-3 需 NeMo>=3.1)
  model:
    - nvidia/diar_streaming_sortformer_4spk-v2
    - nvidia/Nemotron-3-Diarization
  batch_size: 16
  max_speakers: 1
  min_speaker_sec: 0.0  # 任何被检出的第二说话人都计数 (目的是过滤掉含短促附和"嗯/对/是"的样本), 勿调高

asr:
  enabled: true
  model: Qwen/Qwen3-ASR-1.7B
  backend: vllm                # transformers | vllm (vLLM 连续批处理, 吞吐更高)
  gpu_memory_utilization: 0.10
  batch_size: 64
  # context 偏置强制口语数字形态, 免去独立 TN stage
  context: "转写时所有数字一律使用中文汉字数字(如:一八七六年、二百一十亿、百分之五十),禁止使用阿拉伯数字和符号。"

  max_wer: 0.05
  phonetic: true
  adopt_text: true

tn:
  enabled: false           # 兜底用: ASR context 已强制口语数字, 仅当输出仍出现数字/符号时再开
  model: Qwen/Qwen3-4B
  batch_size: 8

align:
  enabled: true
  model: Qwen/Qwen3-ForcedAligner-0.6B
  batch_size: 32

trim:
  enabled: true          # 首尾静音规整: 超出裁剪, 不足补零, 重编码为 FLAC
  head_silence_sec: 0.1
  tail_silence_sec: 0.3

pause:
  enabled: true
  max_gap_sec: 1.5
  max_edge_silence_sec: 1.0

punct:
  enabled: true
  comma_gap_sec: 0.3   # 静音超过且无标点 -> 补逗号
  period_gap_sec: 0.8  # 静音超过且无标点 -> 补句号

tier:                    # emilia-hd-pipeline 质量分档标准 (只打标不过滤)
  enabled: true
  hd_min_pq: 7.0
  hd_max_pc: 2.5
  hd_min_dnsmos: 3.2     # 无 dnsmos 字段的数据集自动跳过该条件
